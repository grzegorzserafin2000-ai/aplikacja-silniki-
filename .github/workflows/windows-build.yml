name: Windows EXE
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:
concurrency:
  group: windows-cm3-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests including Windows GUI
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python launcher.pyw --smoke-test --smoke-report smoke-source.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build windowed portable EXE
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name ClimaGold_ZiehlAbegg_102 --icon assets/climagold_dark.ico --add-data "assets;assets" --hidden-import serial.tools.list_ports launcher.pyw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged EXE starts and address is editable
        run: |
          python verify_exe_icon.py dist/ClimaGold_ZiehlAbegg_102.exe assets/climagold_dark.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Join-Path $PWD 'smoke-exe.json'
          $process = Start-Process -FilePath 'dist/ClimaGold_ZiehlAbegg_102.exe' -ArgumentList @('--smoke-test','--smoke-report',$report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'EXE smoke report is missing' }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $data.gui_started -or -not $data.editable_address_after_preset -or -not $data.factory_communication_preset -or -not $data.logo_loaded -or -not $data.dark_icon_loaded) { throw 'EXE smoke check failed' }
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Instaluj_na_pulpicie.ps1'),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Package
        run: |
          Compress-Archive -Path 'dist/ClimaGold_ZiehlAbegg_102.exe','README_PRZECZYTAJ.txt' -DestinationPath 'dist/ClimaGold_CM3_Windows_TEST.zip' -Force
          $hash = (Get-FileHash 'dist/ClimaGold_CM3_Windows_TEST.zip' -Algorithm SHA256).Hash.ToLower()
          "$hash  ClimaGold_CM3_Windows_TEST.zip" | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii
          "Windows CM3 TEST. Build commit: $env:GITHUB_SHA. Windows GUI tests and packaged EXE smoke check passed. Motor/RS485 hardware remains unverified." | Set-Content 'dist/release-notes.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: ClimaGold-CM3-Windows-TEST
          path: |
            windows/dist/ClimaGold_CM3_Windows_TEST.zip
            windows/dist/SHA256SUMS.txt
            windows/smoke-exe.json
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'windows-cm3-v1.0.2-test'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'Clima Gold Ziehl-Abegg - Windows CM3' --prerelease --notes-file dist/release-notes.txt
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag dist/ClimaGold_CM3_Windows_TEST.zip dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --notes-file dist/release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
